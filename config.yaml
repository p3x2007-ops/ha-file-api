name: File API v2
version: "2.0.0"
slug: file_api_v2
description: API REST avec authentification Bearer pour gérer les fichiers /config/ - permet à Claude d'automatiser les modifications
url: https://github.com/p3x2007-ops/ha-file-api
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
init: false
startup: application
boot: auto
host_network: false
hassio_api: true
hassio_role: default
homeassistant_api: true
auth_api: false
options:
  api_secret: ""
  auth_mode: "home_assistant"
  log_level: "info"
  allowed_extensions:
    - ".yaml"
    - ".yml"
    - ".json"
    - ".js"
    - ".py"
    - ".md"
    - ".txt"
    - ".sh"
  max_file_size_mb: 10

schema:
  api_secret: str?
  auth_mode: list(home_assistant|api_secret|both)
  log_level: list(info|debug|warning|error)
  allowed_extensions: [str]
  max_file_size_mb: int(1,100)

ports:
  8098/tcp: 8098

ports_description:
  8098/tcp: API REST endpoint

map:
  - config:rw

ingress: true
ingress_port: 8098
panel_icon: mdi:file-code
panel_title: File API
