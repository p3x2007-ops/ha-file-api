name: "File API v2"
version: "2.0.0"
slug: "file_api_v2"
description: "API REST avec authentification Bearer pour gérer les fichiers /config/ - permet à Claude d'automatiser les modifications"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
url: "https://github.com/p3x2007-ops/ha-file-api"
startup: application
boot: auto
init: false
ports:
  8100/tcp: 8100
ports_description:
  8100/tcp: "API REST endpoint"
ingress: true
ingress_port: 8100
ingress_stream: false
panel_icon: mdi:file-code
panel_title: "File API"
options:
  api_secret: ""
  auth_mode: "home_assistant"
  log_level: "info"
  allowed_extensions:
    - ".yaml"
    - ".yml"
    - ".json"
    - ".js"
    - ".py"
    - ".md"
    - ".txt"
    - ".sh"
  max_file_size_mb: 10
schema:
  api_secret: password
  auth_mode:
    - home_assistant
    - api_secret
    - both
  log_level:
    - info
    - debug
    - warning
    - error
  allowed_extensions:
    - str
  max_file_size_mb: int(1,100)
