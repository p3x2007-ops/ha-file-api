name: File API v2
version: "2.1.0"
slug: file_api_v2
description: Full-access REST API for Home Assistant filesystem - enables Claude to automate modifications across all volumes | API REST full access pour le filesystem HA - permet à Claude d'automatiser les modifications sur tous les volumes
url: https://github.com/p3x2007-ops/ha-file-api
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
init: false
startup: application
boot: auto
host_network: false
hassio_api: true
hassio_role: manager
homeassistant_api: true
auth_api: false
full_access: true
options:
  api_secret: ""
  auth_mode: "home_assistant"
  log_level: "info"
  allowed_extensions:
    - ".yaml"
    - ".yml"
    - ".json"
    - ".js"
    - ".py"
    - ".md"
    - ".txt"
    - ".sh"
    - ".db"
    - ".log"
    - ".conf"
    - ".toml"
    - ".css"
    - ".html"
  max_file_size_mb: 50

schema:
  api_secret: str?
  auth_mode: list(home_assistant|api_secret|both)
  log_level: list(info|debug|warning|error)
  allowed_extensions: [str]
  max_file_size_mb: int(1,200)

ports:
  8098/tcp: 8098

ports_description:
  8098/tcp: API REST endpoint

map:
  - config:rw
  - share:rw
  - media:rw
  - addons:rw
  - backup:ro
  - ssl:ro

ingress: true
ingress_port: 8098
panel_icon: mdi:file-code
panel_title: File API
